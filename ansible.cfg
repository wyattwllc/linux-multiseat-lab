[defaults]
# Standard Pathing
inventory = infrastructure/inventory.ini
host_key_checking = False
interpreter_python = /usr/bin/python3
nocows = 1

# NOTES: Using /bin/bash is vital for CachyOS as the default 
# 'fish' or 'zsh' shells can mangle Ansible's generated paths.
executable = /bin/bash

# NOTES: Increased timeout for heavy Blackwell driver (DKMS) compilation.
timeout = 60

# NOTES: Ensures the remote 'null' user can actually run commands as root.
become = True
become_method = sudo
become_user = root

[ssh_connection]
# NOTES: 'ControlPersist=30m' keeps the connection socket open for your 
# next launch_seat2.sh run, making subsequent triggers instant.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# NOTES: Pipelining is a massive speed boost for CDI generation.
pipelining = True

# NOTES: Required for 'become' to work reliably over SSH.
scp_if_ssh = True

